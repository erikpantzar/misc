<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>From developer to AI builder · speaker script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap">
<style>
  :root{--ink:#2A1A12;--soft:#5A4232;--paper:#F7EBD3;--card:#FFF6E4;--line:#E0C590;--rust:#B8401A;--teal:#137C7C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Libre Franklin',Arial,sans-serif;font-size:17px;line-height:1.55}
  main{max-width:820px;margin:0 auto;padding:32px 16px 80px}
  nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;font-size:14px}
  nav a,nav button{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;text-decoration:none;font:inherit;cursor:pointer}
  h1{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 8px}
  .lead{color:var(--soft);margin:0 0 24px}
  .summary{display:flex;gap:24px;flex-wrap:wrap;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:32px}
  .summary b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .summary span{color:var(--soft);font-size:14px}
  h2{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:22px;color:var(--rust);margin:40px 0 12px;padding-top:16px;border-top:3px solid var(--line)}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:12px 0;break-inside:avoid}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
  .head h3{margin:0;font-size:19px}
  .num{color:var(--soft);font-weight:600;margin-right:6px}
  .time{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:600;font-size:14px;white-space:nowrap}
  .opt{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--rust);border:1px solid var(--rust);border-radius:4px;padding:1px 6px;margin-left:8px}
  ul{margin:10px 0 0;padding-left:20px}
  li{margin:4px 0}
  .next{margin-top:10px;color:var(--rust);font-style:italic}
  @media print{nav{display:none}body{background:#fff;font-size:12pt}.slide{border-color:#ccc}}
</style>
</head>
<body>
<main>
<nav><a href="index.html">← Deck</a><a href="rehearse.html">Rehearse</a><button onclick="print()">Print</button></nav>
<h1>From developer to AI builder</h1>
<p class="lead">Speaker script, work in progress. Bullets are prompts, not lines to memorize. Times are targets.</p>
<div class="summary" id="summary"></div>
<div id="list"></div>
</main>
<script>
const DATA = [{"id": "cover", "title": "From developer to AI builder", "target": 45, "endsAt": 45, "chapter": "Intro: who this talk is for and a quick live demo of how I work", "bullets": ["Welcome. Thank people for coming.", "One line on the topic: how my job went from writing code to producing solutions with AI.", "Promise: an honest look, a live demo, and a path anyone here can follow."], "next": "First, who I'm talking to.", "optional": false}, {"id": "audience", "title": "Who this talk is for", "target": 60, "endsAt": 105, "chapter": "", "bullets": ["Show of hands: who writes code daily? Who uses AI for most of it? Who hasn't really started?", "Name the three groups on screen: developers, builders, newcomers.", "To newcomers: you haven't missed the wagon. I'll come back to that."], "next": "Rather than tell you, let me show you.", "optional": false}, {"id": "demo", "title": "Let me show you how I work", "target": 300, "endsAt": 405, "chapter": "", "bullets": ["Set the scene: a real task from my week, start to finish.", "Find the issue, write it down, decide how we verify, plan in phases, build, open the PR.", "Narrate the why, not the clicks. Point out where I give context and where I push back.", "If something breaks: say so calmly and keep going. That's part of the lesson.", "Follow the demo script doc for the full scene."], "next": "So who is this person who just did that?", "optional": false}, {"id": "about-me", "title": "Howdy, I'm Erik", "target": 105, "endsAt": 510, "chapter": "About me: who I am and where I come from", "bullets": ["Background: years of frontend and web development in Stockholm. Keep it short.", "Where I work: two companies on my badge. Employed by Sigma Technology Digital Solutions, 65-plus digital experts building user-friendly, accessible solutions, part of Sigma Technology Group with 3,000-plus tech consultants. Through Sigma I'm placed at Teneo.", "Teneo started in Stockholm in 2001 as Artificial Solutions and has taught computers to understand human language for over twenty years. Today it powers more than 17,000 AI agents in contact centers.", "Today: I build Teneo X, where you build, test and run your own voice and chat agents.", "The shift: these days I call myself an AI generalist. AI is my engineering team, I'm the reviewer."], "next": "That shift is what this talk is about.", "optional": false}, {"id": "premise", "title": "I used to write the code. Now I decide what gets built, and make sure it's right.", "target": 75, "endsAt": 585, "chapter": "The shift: from developer to AI builder, and the three jobs of the new role", "bullets": ["Read the line slowly: I used to write the code. Now I decide what gets built, and make sure it's right.", "Pause. Let it land.", "The work moved from typing solutions to producing them."], "next": "Here's what that looks like side by side.", "optional": false}, {"id": "role-shift", "title": "How the role changed", "target": 120, "endsAt": 705, "chapter": "", "bullets": ["Walk the table row by row: main job, time, who I work with, value, what done means.", "Developer skills aren't wasted. Knowing how code works is what lets me judge AI output.", "Ask the room: which row feels most true for you already?"], "next": "If I boil the new role down, it's three jobs.", "optional": false}, {"id": "three-jobs", "title": "The three jobs of an AI builder", "target": 105, "endsAt": 810, "chapter": "", "bullets": ["Produce: decide what's worth solving and own the outcome.", "Instruct: context, constraints and a way to verify.", "Bring taste: the hardest one to hand over. Say no, cut scope.", "Tie back: you saw all three in the demo."], "next": "And the ground under these jobs keeps shifting.", "optional": false}, {"id": "frontier", "title": "The frontier keeps moving", "target": 90, "endsAt": 900, "chapter": "The frontier: the work keeps changing, it is mostly tinkering, and every model has its own temperament", "bullets": ["New models, new tools and new ways of working arrive every few months.", "Give one recent example that changed how I work.", "Nobody has it all figured out. That's what makes it exciting."], "next": "Which means most of my work looks like this.", "optional": false}, {"id": "tinker", "title": "Most of the work is tinkering", "target": 90, "endsAt": 990, "chapter": "", "bullets": ["Try something new on a real task.", "Measure: did it save time, is the result better?", "Adjust the instructions, context or model. Refine what works into a default.", "Then a new model arrives, and you go round again."], "next": "And every model behaves a little differently.", "optional": false}, {"id": "models", "title": "Every model has its own temperament", "target": 90, "endsAt": 1080, "chapter": "", "bullets": ["Quick hands: short and direct instructions.", "Deep thinkers: full context and room to think.", "Specialists: talk to them in their own format.", "Share a quirk I've learned to work around."], "next": "So how does all this fit into a working day?", "optional": false}, {"id": "loop", "title": "My working loop", "target": 75, "endsAt": 1155, "chapter": "In practice: my working loop, hands-on examples, tools, a typical day and lessons", "bullets": ["Define: the problem and how we verify it.", "Direct: a plan in phases, AI builds while I steer.", "Judge: review with taste, check the proof, ship.", "I own both ends of the loop. AI does most of the middle."], "next": "Let me show a few real examples.", "optional": false}, {"id": "examples", "title": "Hands-on examples", "target": 180, "endsAt": 1335, "chapter": "", "bullets": ["Bug to PR: the demo you just saw, about 30 seconds as a recap.", "Example 2: the problem, what I told the AI, where I stepped in, the result.", "Example 3: same structure. Show a screenshot or result if possible."], "next": "Here's what I use to do this.", "optional": false}, {"id": "toolkit", "title": "My saddlebag of tools", "target": 60, "endsAt": 1395, "chapter": "", "bullets": ["Walk through my tools and what each one is for.", "Mention one I tried and dropped.", "This list will look different in six months.", "Optional slide: skip if running long."], "next": "And here's how it fits into a day.", "optional": true}, {"id": "my-day", "title": "A typical day on the trail", "target": 60, "endsAt": 1455, "chapter": "", "bullets": ["Morning plan, deep work directing agents, afternoon review, end of day tinkering.", "Keep examples concrete and a little mundane.", "Optional slide: skip if running long."], "next": "Not everything goes smoothly, though.", "optional": true}, {"id": "lessons", "title": "What I've learned", "target": 75, "endsAt": 1530, "chapter": "", "bullets": ["Works well: first drafts, explaining unfamiliar code, my own example.", "Watch out: confident wrong answers, vague requests giving vague results.", "Short story: one time it saved me, one time it led me astray."], "next": "Now, let's get your imagination going.", "optional": false}, {"id": "idea-board", "title": "Wanted: things you could build", "target": 75, "endsAt": 1605, "chapter": "Inspiration: an ideas board of things to build and workflow recipes", "bullets": ["A wanted board of things you could build.", "Point out two I've built myself and how long they took.", "Steal any of these as your first project."], "next": "And here are some ways to set up the work.", "optional": false}, {"id": "workflows", "title": "Workflow recipes to try", "target": 75, "endsAt": 1680, "chapter": "", "bullets": ["Recipes are setups you can reuse every week.", "Walk through one in detail, for example Project memory or Parallel posse.", "Optional slide: shorten to one recipe if running long."], "next": "Which brings me to you.", "optional": true}, {"id": "never-late", "title": "Never worked with AI? You can saddle up today.", "target": 75, "endsAt": 1755, "chapter": "How you get there: you can start today, start small, and grow with good instructions and mindset", "bullets": ["If you haven't used AI in the last few years, that's fine.", "Much of what early adopters learned is already outdated. Today's tools are easier.", "Start now, and you can be as productive as anyone. Curiosity beats history."], "next": "So how do you actually start?", "optional": false}, {"id": "start-steps", "title": "Start small, then ride further", "target": 60, "endsAt": 1815, "chapter": "", "bullets": ["Start small: one tool, one real task.", "Feel it out: try, notice, adjust.", "Grow confidence: bigger problems as trust builds."], "next": "When you do ask, ask well.", "optional": false}, {"id": "prompt-anatomy", "title": "Instructions that work", "target": 60, "endsAt": 1875, "chapter": "", "bullets": ["Goal, context, constraints, verification: what you'd tell a colleague.", "Verification is the one people skip, and it makes the result trustworthy.", "These examples match the demo."], "next": "And keep this mindset.", "optional": false}, {"id": "mindset", "title": "Think like a trail boss", "target": 45, "endsAt": 1920, "chapter": "", "bullets": ["Treat output as a draft. You own the result.", "Iterate instead of restarting.", "Let it ask you questions first."], "next": "One last thought.", "optional": false}, {"id": "imagination", "title": "The only fence out here is your imagination.", "target": 30, "endsAt": 1950, "chapter": "Wrap-up: imagination is the limit, keep exploring, questions", "bullets": ["Read it slowly: the only fence out here is your imagination.", "Pause. What you can build is limited by what you can picture."], "next": "So here's my ask.", "optional": false}, {"id": "statement", "title": "Start small. Keep exploring. Keep learning.", "target": 30, "endsAt": 1980, "chapter": "", "bullets": ["Start small. Keep exploring. Keep learning.", "Pick one real problem this week. Define it, direct the AI, judge the result.", "Invite people to share what they tried."], "next": "Thank you. Questions?", "optional": false}, {"id": "closing", "title": "Questions?", "target": 300, "endsAt": 2280, "chapter": "", "bullets": ["Q&A. Repeat each question so everyone hears it.", "Backup question if quiet: what do I not use AI for?", "Point to resources and how to reach me."], "next": "", "optional": false}];
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const total = DATA.at(-1).endsAt, qa = DATA.at(-1).target, opt = DATA.filter(d => d.optional).reduce((a, d) => a + d.target, 0);
document.getElementById('summary').innerHTML =
  `<div><b>${fmt(total - qa)}</b><span>talk</span></div><div><b>${fmt(qa)}</b><span>Q&amp;A</span></div><div><b>${fmt(total)}</b><span>total</span></div><div><b>${fmt(opt)}</b><span>can be cut (optional slides)</span></div><div><b>${DATA.length}</b><span>slides</span></div>`;
document.getElementById('list').innerHTML = DATA.map((d, k) =>
  `${d.chapter ? `<h2>${esc(d.chapter.split(':')[0])}</h2>` : ''}<div class="slide"><div class="head"><h3><span class="num">${k + 1}</span>${esc(d.title)}${d.optional ? '<span class="opt">optional</span>' : ''}</h3><span class="time">${fmt(d.target)} · ends ${fmt(d.endsAt)}</span></div><ul>${d.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>${d.next ? `<div class="next">→ ${esc(d.next)}</div>` : ''}</div>`).join('');
</script>
</body>
</html>
