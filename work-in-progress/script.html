<style>
  :root{--ink:#2A1A12;--soft:#5A4232;--paper:#F7EBD3;--card:#FFF6E4;--line:#E0C590;--rust:#B8401A;--teal:#137C7C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Libre Franklin',Arial,sans-serif;font-size:17px;line-height:1.55}
  main{max-width:820px;margin:0 auto;padding:32px 16px 80px}
  nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;font-size:14px}
  nav a,nav button{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;text-decoration:none;font:inherit;cursor:pointer}
  h1{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 8px}
  .lead{color:var(--soft);margin:0 0 24px}
  .summary{display:flex;gap:24px;flex-wrap:wrap;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:32px}
  .summary b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .summary span{color:var(--soft);font-size:14px}
  h2{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:22px;color:var(--rust);margin:40px 0 12px;padding-top:16px;border-top:3px solid var(--line)}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:12px 0;break-inside:avoid}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
  .head h3{margin:0;font-size:19px}
  .num{color:var(--soft);font-weight:600;margin-right:6px}
  .time{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:600;font-size:14px;white-space:nowrap}
  .opt{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--rust);border:1px solid var(--rust);border-radius:4px;padding:1px 6px;margin-left:8px}
  ul{margin:10px 0 0;padding-left:20px}
  li{margin:4px 0}
  .next{margin-top:10px;color:var(--rust);font-style:italic}
  @media print{nav{display:none}body{background:#fff;font-size:12pt}.slide{border-color:#ccc}}
</style>
</head>

<h1>From developer to AI builder</h1>
<p class="lead">Speaker script, work in progress. Bullets are prompts, not lines to memorize. Times are targets.</p>
<div class="summary" id="summary"></div>
<div id="list"></div>
</main>
<script>
const DATA = [{"id": "cover", "title": "From developer to AI builder", "target": 45, "endsAt": 45, "chapter": "Who I am", "bullets": ["Hi everyone, and thanks for coming.", "Tonight is about how my job changed.", "I'll keep this honest."], "next": "Howdy, I'm Erik", "optional": false}, {"id": "about-me", "title": "Howdy, I'm Erik", "target": 75, "endsAt": 120, "chapter": "", "bullets": ["So who am I?", "And the questions I care about have stayed the same the whole way.", "Today I'm a consultant at Sigma Technology, placed at Teneo.", "Here's the funny part."], "next": "Who this talk is for", "optional": false}, {"id": "audience", "title": "Who this talk is for", "target": 60, "endsAt": 180, "chapter": "", "bullets": ["Before we ride, a quick check.", "Good.", "To the newcomers: you haven't."], "next": "I used to write the code. Now I decide what gets built, and make sure it's right.", "optional": false}, {"id": "premise", "title": "I used to write the code. Now I decide what gets built, and make sure it's right.", "target": 60, "endsAt": 240, "chapter": "", "bullets": ["I used to write the code.", "That's the whole shift.", "Today the typing is mostly done by AI.", "So the work didn't go away."], "next": "What is AI, anyway?", "optional": false}, {"id": "what-is-ai", "title": "What is AI, anyway?", "target": 60, "endsAt": 300, "chapter": "Under the hood", "bullets": ["So, what is AI?", "Inside that is machine learning.", "And inside that, the thing everyone means when they say AI today."], "next": "An LLM predicts the next word", "optional": false}, {"id": "llm", "title": "An LLM predicts the next word", "target": 75, "endsAt": 375, "chapter": "", "bullets": ["A large language model does one thing.", "Three words worth knowing.", "How is it made?"], "next": "How full is its working memory?", "optional": false}, {"id": "ex-llm", "title": "How full is its working memory?", "target": 40, "endsAt": 415, "chapter": "", "bullets": ["Here's what that looks like for real.", "And here's the part people miss."], "next": "Models come in sizes", "optional": false}, {"id": "models", "title": "Models come in sizes", "target": 60, "endsAt": 475, "chapter": "", "bullets": ["There isn't one AI.", "Bigger is smarter, but slower and pricier.", "And every model has its own temperament."], "next": "Which model I actually picked", "optional": false}, {"id": "ex-models", "title": "Which model I actually picked", "target": 45, "endsAt": 520, "chapter": "", "bullets": ["And this is how I actually pick.", "The big stuff goes on the strong models."], "next": "Agents: a model with tools, in a loop", "optional": false}, {"id": "agents", "title": "Agents: a model with tools, in a loop", "target": 90, "endsAt": 610, "chapter": "", "bullets": ["A chat answers you.", "It gets a goal.", "The tools are what make it useful.", "What changed for me recently: agents managing agents.", "For the power users: one night my agents closed all sixteen issues on a list and called it done."], "next": "One message, one helper agent, two minutes", "optional": false}, {"id": "ex-agents", "title": "One message, one helper agent, two minutes", "target": 45, "endsAt": 655, "chapter": "", "bullets": ["A real one.", "Two minutes and twenty-one tool calls later, it was done."], "next": "What the agent reads, every single turn", "optional": false}, {"id": "context", "title": "What the agent reads, every single turn", "target": 90, "endsAt": 745, "chapter": "", "bullets": ["So how do you keep an agent in check?", "First the system prompt: the tool's own rules, and the tools it may use.", "That's why a rule in CLAUDE.md works.", "It's also why long sessions get slow and get summarised."], "next": "Read at the start, so restart to change it", "optional": false}, {"id": "ex-context", "title": "Read at the start, so restart to change it", "target": 40, "endsAt": 785, "chapter": "", "bullets": ["I learned this one the hard way.", "Same goes for your rules file."], "next": "Skills: know-how in a folder", "optional": false}, {"id": "skills", "title": "Skills: know-how in a folder", "target": 60, "endsAt": 845, "chapter": "", "bullets": ["If agents are the workers, skills are their know-how.", "This is a real one from my machine.", "And that's the clever bit."], "next": "When is a skill worth making?", "optional": false}, {"id": "skills-when", "title": "When is a skill worth making?", "target": 60, "endsAt": 905, "chapter": "", "bullets": ["So when is a skill worth making?", "And when it's something else.", "Two ways a skill runs."], "next": "Watch a skill kick in", "optional": false}, {"id": "ex-skills-run", "title": "Watch a skill kick in", "target": 45, "endsAt": 950, "chapter": "", "bullets": ["Here's one from making this very deck.", "Then I said: show me the deck."], "next": "Building my own: the Linear skill", "optional": false}, {"id": "ex-skills", "title": "Building my own: the Linear skill", "target": 45, "endsAt": 995, "chapter": "", "bullets": ["And building your own.", "How did I know it was time?"], "next": "What I think will always be true", "optional": false}, {"id": "forever", "title": "What I think will always be true", "target": 75, "endsAt": 1070, "chapter": "Human in the loop", "bullets": ["If you only remember one slide, make it this one.", "One way in: explore together.", "The other: define a real goal.", "And if you're not sure yet, explore some more."], "next": "Prototype first, then the real thing", "optional": false}, {"id": "ex-forever", "title": "Prototype first, then the real thing", "target": 45, "endsAt": 1115, "chapter": "", "bullets": ["My shopping-list app went exactly like that.", "Using it told me what was missing.", "And by then, done was crystal clear."], "next": "Human in the loop: my working loop", "optional": false}, {"id": "loop", "title": "Human in the loop: my working loop", "target": 75, "endsAt": 1190, "chapter": "", "bullets": ["So where's the human in all this?", "Define.", "Direct.", "Judge.", "I own both ends of the loop."], "next": "The loop on a real task: 11 minutes", "optional": false}, {"id": "ex-loop", "title": "The loop on a real task: 11 minutes", "target": 60, "endsAt": 1250, "chapter": "", "bullets": ["Here's the loop on a real task.", "Seven minutes past.", "Twelve past.", "Seventeen past."], "next": "Plan mode: agree the plan before any code", "optional": false}, {"id": "plan-mode", "title": "Plan mode: agree the plan before any code", "target": 60, "endsAt": 1310, "chapter": "", "bullets": ["Here's a tool that makes define and direct concrete.", "In plan mode the AI reads the code, looks around and writes a plan.", "So I see the route before we ride out.", "Is it always worth it?"], "next": "It asked before it built", "optional": false}, {"id": "ex-plan", "title": "It asked before it built", "target": 40, "endsAt": 1350, "chapter": "", "bullets": ["And this is what \"interview me\" looked like.", "That last one I'd never have thought of."], "next": "Think like a trail boss", "optional": false}, {"id": "mindset", "title": "Think like a trail boss", "target": 45, "endsAt": 1395, "chapter": "", "bullets": ["Last, the mindset.", "Iterate, don't restart."], "next": "Keep the brakes on", "optional": false}, {"id": "ex-brakes", "title": "Keep the brakes on", "target": 45, "endsAt": 1440, "chapter": "", "bullets": ["Two from my own setup.", "And in July, while setting up Linear, it tried to read the file where my login tokens live."], "next": "Don't be the meat proxy", "optional": false}, {"id": "meat-proxy", "title": "Don't be the meat proxy", "target": 60, "endsAt": 1500, "chapter": "", "bullets": ["Here's a trap I fell into.", "The fix: give the agent the tools to do that loop itself.", "So if you notice you're just carrying messages back and forth, stop."], "next": "Sometimes I have to be the hands", "optional": false}, {"id": "ex-meat", "title": "Sometimes I have to be the hands", "target": 40, "endsAt": 1540, "chapter": "", "bullets": ["To be fair, sometimes I do have to be the hands.", "It explained why: localhost means my laptop, not the server.", "Logins and approvals are my job."], "next": "Stuck? Get a lesson, then keep going", "optional": false}, {"id": "learn-with-ai", "title": "Stuck? Get a lesson, then keep going", "target": 75, "endsAt": 1615, "chapter": "Keep learning", "bullets": ["Now, learning.", "A quick one, on exactly the topics I need to move forward.", "It's like a patient senior colleague who never sighs.", "And it works outside code too."], "next": "Quick lessons, then back to work", "optional": false}, {"id": "ex-learn", "title": "Quick lessons, then back to work", "target": 40, "endsAt": 1655, "chapter": "", "bullets": ["And here's what learning looks like day to day.", "Tiny questions."], "next": "Ask for an artifact, not a wall of text", "optional": false}, {"id": "artifacts", "title": "Ask for an artifact, not a wall of text", "target": 75, "endsAt": 1730, "chapter": "", "bullets": ["And here's how I like my lessons served.", "My go-to ask is pretty much this.", "It's surprisingly good.", "A lot of the pieces around this talk were made that way."], "next": "This deck is an artifact", "optional": false}, {"id": "ex-artifacts", "title": "This deck is an artifact", "target": 40, "endsAt": 1770, "chapter": "", "bullets": ["And the best example of an artifact is the one you're looking at.", "And yesterday I said exactly this: make it into a nice artifact, on the level of your choice, talking to me as me."], "next": "The frontier keeps moving", "optional": false}, {"id": "frontier", "title": "The frontier keeps moving", "target": 40, "endsAt": 1810, "chapter": "", "bullets": ["And the learning never stops, because the ground keeps moving.", "So most of my work is tinkering.", "And nobody has this figured out."], "next": "Prompt engineering, then and now", "optional": false}, {"id": "prompting", "title": "Prompt engineering, then and now", "target": 60, "endsAt": 1870, "chapter": "", "bullets": ["A word on prompt engineering.", "Today's models mostly don't need it.", "But over time you shape it to how you work."], "next": "My dialect", "optional": false}, {"id": "ex-dialect", "title": "My dialect", "target": 40, "endsAt": 1910, "chapter": "", "bullets": ["Here's my dialect, for real.", "And on the right, the deploy to my live database at home.", "Same me, same model."], "next": "Never worked with AI? You can saddle up today.", "optional": false}, {"id": "never-late", "title": "Never worked with AI? You can saddle up today.", "target": 75, "endsAt": 1985, "chapter": "", "bullets": ["Now, back to the newcomers.", "Never worked with AI?", "If you haven't really used AI in the last few years, that's fine.", "So the head start is smaller than it looks.", "And for those of us who did start early: same goes for us."], "next": "Let me show you how I work", "optional": false}, {"id": "demo", "title": "Let me show you how I work", "target": 240, "endsAt": 2225, "chapter": "Building in practice", "bullets": ["This is a real task, just a small one.", "Here's the issue.", "First step is define.", "Now direct.", "This is the AI building."], "next": "Hands-on examples", "optional": false}, {"id": "examples", "title": "Hands-on examples", "target": 60, "endsAt": 2285, "chapter": "", "bullets": ["That app you just saw in the video?", "On one evening, October fifth, I revived it.", "Where did I step in?"], "next": "Instructions that work", "optional": false}, {"id": "prompt-anatomy", "title": "Instructions that work", "target": 60, "endsAt": 2345, "chapter": "", "bullets": ["Here's what a good instruction looks like.", "Goal: make the search box clearly show when it's focused, and show results like the mockup.", "Context: it's my movie app, and the issue has two screenshots.", "Constraints: only touch the search, keep the app's colours, leave the header alone.", "And verification: the app still builds, the tests pass, and it matches the screenshots."], "next": "A real instruction, taken apart", "optional": false}, {"id": "ex-prompt", "title": "A real instruction, taken apart", "target": 45, "endsAt": 2390, "chapter": "", "bullets": ["And here's that deploy prompt taken apart, using the four parts.", "And verification."], "next": "Wanted: things you could build", "optional": false}, {"id": "idea-board", "title": "Wanted: things you could build", "target": 75, "endsAt": 2465, "chapter": "", "bullets": ["Now let's get your imagination going.", "A few of these I've built myself.", "Review sheriff.", "Afternoon prototype.", "None of these are big."], "next": "The spinning jenny: better tools, more work", "optional": false}, {"id": "spinning-jenny", "title": "The spinning jenny: better tools, more work", "target": 85, "endsAt": 2550, "chapter": "The open range", "bullets": ["So where does this leave us?", "So people worked less, right?", "There's a name for this pattern.", "And not everyone won.", "So this isn't a law of nature."], "next": "Software got cheap. What's left is us.", "optional": false}, {"id": "taste", "title": "Software got cheap. What's left is us.", "target": 45, "endsAt": 2595, "chapter": "", "bullets": ["So software just got a lot cheaper.", "Taste.", "And imagination."], "next": "If you can envision it, you can build it.", "optional": false}, {"id": "imagination", "title": "If you can envision it, you can build it.", "target": 30, "endsAt": 2625, "chapter": "", "bullets": ["If you can envision it, you can build it.", "That was not true five years ago."], "next": "Pick one real problem. Picture it. Build it.", "optional": false}, {"id": "statement", "title": "Pick one real problem. Picture it. Build it.", "target": 30, "endsAt": 2655, "chapter": "", "bullets": ["So here's my ask.", "Not a big one."], "next": "Questions?", "optional": false}, {"id": "closing", "title": "Questions?", "target": 900, "endsAt": 3555, "chapter": "", "bullets": ["Thank you so much.", "A question I get a lot is...", "Backup 1.", "Backup 2.", "Backup 3."], "next": "", "optional": false}];
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const total = DATA.at(-1).endsAt, qa = DATA.at(-1).target, opt = DATA.filter(d => d.optional).reduce((a, d) => a + d.target, 0);
document.getElementById('summary').innerHTML =
  `<div><b>${fmt(total - qa)}</b><span>talk</span></div><div><b>${fmt(qa)}</b><span>Q&amp;A</span></div><div><b>${fmt(total)}</b><span>total</span></div><div><b>${fmt(opt)}</b><span>can be cut (optional slides)</span></div><div><b>${DATA.length}</b><span>slides</span></div>`;
document.getElementById('list').innerHTML = DATA.map((d, k) =>
  `${d.chapter ? `<h2>${esc(d.chapter.split(':')[0])}</h2>` : ''}<div class="slide"><div class="head"><h3><span class="num">${k + 1}</span>${esc(d.title)}${d.optional ? '<span class="opt">optional</span>' : ''}</h3><span class="time">${fmt(d.target)} · ends ${fmt(d.endsAt)}</span></div><ul>${d.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>${d.next ? `<div class="next">→ ${esc(d.next)}</div>` : ''}</div>`).join('');
</script>
