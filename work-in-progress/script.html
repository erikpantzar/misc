<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>From developer to AI builder · speaker script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap">
<style>
  :root{--ink:#2A1A12;--soft:#5A4232;--paper:#F7EBD3;--card:#FFF6E4;--line:#E0C590;--rust:#B8401A;--teal:#137C7C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Libre Franklin',Arial,sans-serif;font-size:17px;line-height:1.55}
  main{max-width:820px;margin:0 auto;padding:32px 16px 80px}
  nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;font-size:14px}
  nav a,nav button{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;text-decoration:none;font:inherit;cursor:pointer}
  h1{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0 0 8px}
  .lead{color:var(--soft);margin:0 0 24px}
  .summary{display:flex;gap:24px;flex-wrap:wrap;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:32px}
  .summary b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .summary span{color:var(--soft);font-size:14px}
  h2{font-family:'Ultra',Georgia,serif;font-weight:400;font-size:22px;color:var(--rust);margin:40px 0 12px;padding-top:16px;border-top:3px solid var(--line)}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:12px 0;break-inside:avoid}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
  .head h3{margin:0;font-size:19px}
  .num{color:var(--soft);font-weight:600;margin-right:6px}
  .time{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:600;font-size:14px;white-space:nowrap}
  .opt{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--rust);border:1px solid var(--rust);border-radius:4px;padding:1px 6px;margin-left:8px}
  ul{margin:10px 0 0;padding-left:20px}
  li{margin:4px 0}
  .next{margin-top:10px;color:var(--rust);font-style:italic}
  @media print{nav{display:none}body{background:#fff;font-size:12pt}.slide{border-color:#ccc}}
</style>
</head>
<body>
<main>
<nav><a href="index.html">← Deck</a><a href="rehearse.html">Rehearse</a><button onclick="print()">Print</button></nav>
<h1>From developer to AI builder</h1>
<p class="lead">Speaker script, work in progress. Bullets are prompts, not lines to memorize. Times are targets.</p>
<div class="summary" id="summary"></div>
<div id="list"></div>
</main>
<script>
const DATA = [{"id": "cover", "title": "From developer to AI builder", "target": 45, "endsAt": 45, "chapter": "Who I am", "bullets": ["Hi everyone, and thanks for coming.", "Tonight is about how my job changed.", "I'll keep this honest."], "next": "Howdy, I'm Erik", "optional": false}, {"id": "about-me", "title": "Howdy, I'm Erik", "target": 75, "endsAt": 120, "chapter": "", "bullets": ["So who am I?", "And the questions I care about have stayed the same the whole way.", "Today I'm a consultant at Sigma Technology, placed at Teneo.", "Here's the funny part."], "next": "Who this talk is for", "optional": false}, {"id": "audience", "title": "Who this talk is for", "target": 60, "endsAt": 180, "chapter": "", "bullets": ["Before we ride, a quick check.", "Good.", "To the newcomers: you haven't."], "next": "I used to write the code. Now I decide what gets built, and make sure it's right.", "optional": false}, {"id": "premise", "title": "I used to write the code. Now I decide what gets built, and make sure it's right.", "target": 60, "endsAt": 240, "chapter": "", "bullets": ["I used to write the code.", "That's the whole shift.", "Today the typing is mostly done by AI.", "So the work didn't go away."], "next": "What is AI, anyway?", "optional": false}, {"id": "what-is-ai", "title": "What is AI, anyway?", "target": 60, "endsAt": 300, "chapter": "Under the hood", "bullets": ["So, what is AI?", "Inside that is machine learning.", "And inside that, the thing everyone means when they say AI today."], "next": "An LLM predicts the next word", "optional": false}, {"id": "llm", "title": "An LLM predicts the next word", "target": 75, "endsAt": 375, "chapter": "", "bullets": ["A large language model does one thing.", "Three words worth knowing.", "How is it made?"], "next": "Models come in sizes", "optional": false}, {"id": "models", "title": "Models come in sizes", "target": 60, "endsAt": 435, "chapter": "", "bullets": ["There isn't one AI.", "Bigger is smarter, but slower and pricier.", "And every model has its own temperament."], "next": "Agents: a model with tools, in a loop", "optional": false}, {"id": "agents", "title": "Agents: a model with tools, in a loop", "target": 90, "endsAt": 525, "chapter": "", "bullets": ["A chat answers you.", "It gets a goal.", "The tools are what make it useful.", "What changed for me recently: agents managing agents.", "For the power users: one night my agents closed all sixteen issues on a list and called it done."], "next": "Skills: recipe cards for agents", "optional": false}, {"id": "skills", "title": "Skills: recipe cards for agents", "target": 60, "endsAt": 585, "chapter": "", "bullets": ["If agents are the workers, skills are their recipe cards.", "The clever bit: the agent only sees the name and a one-line description up front.", "Next to that I keep project memory: one short file it always reads first.", "Write the know-how down once, and every session gets it."], "next": "My working loop", "optional": false}, {"id": "loop", "title": "My working loop", "target": 75, "endsAt": 660, "chapter": "Human in the loop", "bullets": ["So where's the human in all this?", "Define.", "Direct.", "Judge.", "I own both ends of the loop."], "next": "Plan mode: agree the plan before any code", "optional": false}, {"id": "plan-mode", "title": "Plan mode: agree the plan before any code", "target": 60, "endsAt": 720, "chapter": "", "bullets": ["Here's a tool that makes define and direct concrete.", "In plan mode the AI reads the code, looks around and writes a plan.", "So I see the route before we ride out.", "Is it always worth it?"], "next": "Think like a trail boss", "optional": false}, {"id": "mindset", "title": "Think like a trail boss", "target": 45, "endsAt": 765, "chapter": "", "bullets": ["Last, the mindset.", "Iterate, don't restart."], "next": "Don't be the meat proxy", "optional": false}, {"id": "meat-proxy", "title": "Don't be the meat proxy", "target": 60, "endsAt": 825, "chapter": "", "bullets": ["Here's a trap I fell into.", "The fix: give the agent the tools to do that loop itself.", "So if you notice you're just carrying messages back and forth, stop."], "next": "Stuck? Get a lesson, then keep going", "optional": false}, {"id": "learn-with-ai", "title": "Stuck? Get a lesson, then keep going", "target": 75, "endsAt": 900, "chapter": "Keep learning", "bullets": ["Now, learning.", "A quick one, on exactly the topics I need to move forward.", "It's like a patient senior colleague who never sighs.", "And it works outside code too."], "next": "Ask for an artifact, not a wall of text", "optional": false}, {"id": "artifacts", "title": "Ask for an artifact, not a wall of text", "target": 75, "endsAt": 975, "chapter": "", "bullets": ["And here's how I like my lessons served.", "My go-to ask is pretty much this.", "It's surprisingly good.", "A lot of the pieces around this talk were made that way."], "next": "The frontier keeps moving", "optional": false}, {"id": "frontier", "title": "The frontier keeps moving", "target": 50, "endsAt": 1025, "chapter": "", "bullets": ["And the learning never stops, because the ground keeps moving.", "So most of my work is tinkering.", "And nobody has this figured out."], "next": "Never worked with AI? You can saddle up today.", "optional": false}, {"id": "never-late", "title": "Never worked with AI? You can saddle up today.", "target": 75, "endsAt": 1100, "chapter": "", "bullets": ["Now, back to the newcomers.", "Never worked with AI?", "If you haven't really used AI in the last few years, that's fine.", "So the head start is smaller than it looks.", "And for those of us who did start early: same goes for us."], "next": "Let me show you how I work", "optional": false}, {"id": "demo", "title": "Let me show you how I work", "target": 240, "endsAt": 1340, "chapter": "Building in practice", "bullets": ["This is a real task, just a small one.", "Here's the issue.", "First step is define.", "Now direct.", "This is the AI building."], "next": "Hands-on examples", "optional": false}, {"id": "examples", "title": "Hands-on examples", "target": 60, "endsAt": 1400, "chapter": "", "bullets": ["That app you just saw in the video?", "On one evening, October fifth, I revived it.", "Where did I step in?"], "next": "Instructions that work", "optional": false}, {"id": "prompt-anatomy", "title": "Instructions that work", "target": 60, "endsAt": 1460, "chapter": "", "bullets": ["Here's what a good instruction looks like.", "Goal: make the search box clearly show when it's focused, and show results like the mockup.", "Context: it's my movie app, and the issue has two screenshots.", "Constraints: only touch the search, keep the app's colours, leave the header alone.", "And verification: the app still builds, the tests pass, and it matches the screenshots."], "next": "Wanted: things you could build", "optional": false}, {"id": "idea-board", "title": "Wanted: things you could build", "target": 75, "endsAt": 1535, "chapter": "", "bullets": ["Now let's get your imagination going.", "A few of these I've built myself.", "Review sheriff.", "Afternoon prototype.", "None of these are big."], "next": "The spinning jenny: better tools, more work", "optional": false}, {"id": "spinning-jenny", "title": "The spinning jenny: better tools, more work", "target": 85, "endsAt": 1620, "chapter": "The open range", "bullets": ["So where does this leave us?", "So people worked less, right?", "There's a name for this pattern.", "And not everyone won.", "So this isn't a law of nature."], "next": "Software got cheap. What's left is us.", "optional": false}, {"id": "taste", "title": "Software got cheap. What's left is us.", "target": 45, "endsAt": 1665, "chapter": "", "bullets": ["So software just got a lot cheaper.", "Taste.", "And imagination."], "next": "The only fence out here is your imagination.", "optional": false}, {"id": "imagination", "title": "The only fence out here is your imagination.", "target": 30, "endsAt": 1695, "chapter": "", "bullets": ["If you can envision it, you can build it.", "That was not true five years ago."], "next": "Start small. Keep exploring. Keep learning.", "optional": false}, {"id": "statement", "title": "Start small. Keep exploring. Keep learning.", "target": 30, "endsAt": 1725, "chapter": "", "bullets": ["So here's my ask.", "Not a big one."], "next": "Questions?", "optional": false}, {"id": "closing", "title": "Questions?", "target": 900, "endsAt": 2625, "chapter": "", "bullets": ["Thank you so much.", "A question I get a lot is...", "Backup 1.", "Backup 2.", "Backup 3."], "next": "", "optional": false}];
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const total = DATA.at(-1).endsAt, qa = DATA.at(-1).target, opt = DATA.filter(d => d.optional).reduce((a, d) => a + d.target, 0);
document.getElementById('summary').innerHTML =
  `<div><b>${fmt(total - qa)}</b><span>talk</span></div><div><b>${fmt(qa)}</b><span>Q&amp;A</span></div><div><b>${fmt(total)}</b><span>total</span></div><div><b>${fmt(opt)}</b><span>can be cut (optional slides)</span></div><div><b>${DATA.length}</b><span>slides</span></div>`;
document.getElementById('list').innerHTML = DATA.map((d, k) =>
  `${d.chapter ? `<h2>${esc(d.chapter.split(':')[0])}</h2>` : ''}<div class="slide"><div class="head"><h3><span class="num">${k + 1}</span>${esc(d.title)}${d.optional ? '<span class="opt">optional</span>' : ''}</h3><span class="time">${fmt(d.target)} · ends ${fmt(d.endsAt)}</span></div><ul>${d.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>${d.next ? `<div class="next">→ ${esc(d.next)}</div>` : ''}</div>`).join('');
</script>
</body>
</html>
